services:
  client:
    image: ppw-client:latest
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - SERVER=${SERVER}
      - SECRET_API_KEY=${SECRET_API_KEY}
      - NEXT_PUBLIC_CARD_COMPONENT_IMAGE_PLACEHOLDER=${NEXT_PUBLIC_CARD_COMPONENT_IMAGE_PLACEHOLDER}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CLIENT_PORT} || exit 1"]
  server:
    image: ppw-server:latest
    restart: always
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres_db:
        condition: service_healthy
    command: sh -c 'npx prisma migrate dev && npx prisma generate && npm run start:dev'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMINER_PORT=${ADMINER_PORT}
      - PORT=${SERVER_PORT}
      - CLIENT=${CLIENT}
      - RATE_TTL=${RATE_TTL}
      - RATE_LIMIT=${RATE_LIMIT}
      - APP_PASSWORD=${APP_PASSWORD}
      - USER_EMAIL=${USER_EMAIL}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_HOST_PORT=${MAIL_HOST_PORT}
      - SECRET_API_KEY=${SECRET_API_KEY}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${SERVER_PORT}/health || exit 1",
        ]
      interval: 5s
      retries: 10

  postgres_db:
    image: postgres:latest
    ports:
      - "${PGPORT}:${PGPORT}"
    environment:
      - POSTGRES_USER=${PGUSERNAME}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ppw-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSERNAME}"]
      interval: 5s
      retries: 3

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 8081:8080

volumes:
  ppw-pg-data:
